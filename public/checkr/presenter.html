<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Presenter view</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Presenter view for the deck at /checkr. It follows the deck tab open in the same browser.
   This file holds no talking points: they arrive once in the link's #fragment, which the
   browser never sends to the server, and are kept in this browser's storage after that. */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --ink:#15211F; --muted:#5E6B68; --line:#D6DDD9;
  --accent:#0F6E5C; --accent-soft:#DDEFE8; --signal:#B9671C; --signal-soft:#F7E8D6;
  --display:"Archivo",system-ui,sans-serif; --body:"Source Serif 4",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{--bg:#111917;--surface:#18221F;--ink:#E9EEEB;--muted:#9FAEA9;--line:#2A3734;--accent:#4FC2A3;--accent-soft:#17352D;--signal:#E8A353;--signal-soft:#3A2A14;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.6rem max(16px,env(safe-area-inset-right,0px)) .6rem max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--signal);flex:none}
.dot.live{background:var(--accent)}
.grow{flex:1;min-width:0}
.clock{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--ink);font-variant-numeric:tabular-nums}
button{font:600 .75rem var(--display);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:.4rem .7rem;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:1.25rem 16px 2rem;display:flex;flex-direction:column;gap:1rem}
.where{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.1;margin:0;text-wrap:balance}
.step{align-self:flex-start;font:600 .75rem var(--display);letter-spacing:.06em;text-transform:uppercase;padding:.25rem .6rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.7rem}
li{font-size:clamp(1.15rem,2.4vw,1.55rem);line-height:1.3;padding-left:1rem;border-left:3px solid var(--line)}
li.light{font-style:italic;color:var(--signal);border-left-color:var(--signal)}
.next{margin-top:auto;border-top:1px dashed var(--line);padding-top:.75rem;color:var(--muted);font-size:1rem}
.next b{font-family:var(--display);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;margin-right:.5rem}
.empty{color:var(--muted);font-size:1.1rem;max-width:60ch}
</style>
</head>
<body>
<div class="top">
  <span class="dot" id="dot"></span>
  <span class="grow" id="status">Waiting for the deck tab. Open /checkr in this browser.</span>
  <span class="clock" id="clock">0:00</span>
  <button id="startStop">Start</button>
  <button id="reset">Reset</button>
</div>
<main>
  <div class="where" id="where"></div>
  <h1 id="title"></h1>
  <span class="step" id="step" hidden></span>
  <ul id="notes"></ul>
  <p class="empty" id="empty" hidden></p>
  <div class="next" id="next" hidden></div>
</main>
<script>
(function(){
  var KEY='checkr-notes';
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

  /* Talking points come in once as #n=<base64url JSON>. Keep them here and clear the address bar. */
  var m=(location.hash||'').match(/^#n=([A-Za-z0-9_-]+)$/);
  if(m){
    try{
      var b=atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));
      var bytes=new Uint8Array(b.length);for(var i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);
      var text=new TextDecoder().decode(bytes);
      JSON.parse(text);store(KEY,text);
    }catch(e){}
    try{history.replaceState(null,'',location.pathname);}catch(e){}
  }
  var notes={};try{notes=JSON.parse(store(KEY)||'{}')||{};}catch(e){notes={};}
  var haveNotes=Object.keys(notes).length>0;

  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function render(d){
    $('dot').classList.add('live');
    $('status').textContent='Following the deck. Arrow keys here move it too.';
    $('where').textContent=d.pos+' / '+d.n;
    $('title').textContent=d.title||'';
    $('step').hidden=!d.step;$('step').textContent=d.step||'';
    var list=notes[d.id]||[];
    $('notes').innerHTML=list.map(function(x){
      var light=/^Light: /.test(x);
      return '<li'+(light?' class="light"':'')+'>'+esc(light?x.slice(7):x)+'</li>';
    }).join('');
    $('empty').hidden=haveNotes;
    $('next').hidden=!d.next;$('next').innerHTML=d.next?'<b>Next</b>'+esc(d.next):'';
  }
  if(!haveNotes){$('empty').hidden=false;$('empty').textContent='No talking points are saved in this browser yet. Open the presenter link that includes them once, and they will stay here.';}

  var bc=null;try{bc=new BroadcastChannel('checkr-deck');}catch(e){}
  if(bc){
    bc.onmessage=function(e){var d=e.data||{};if(d.t==='slide'){render(d);if(d.pos>1&&!running&&elapsed===0)start();}};
    bc.postMessage({t:'hello'});
  }else{$('status').textContent='This browser cannot link tabs. Use a current Chrome, Safari, Edge or Firefox.';}
  function go(by){if(bc)bc.postMessage({t:'go',by:by});}
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(1);e.preventDefault();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1);e.preventDefault();}
  });

  /* Timer: starts by itself when the deck leaves the title slide. */
  var running=false,elapsed=0,since=0;
  function now(){return elapsed+(running?Date.now()-since:0);}
  function paint(){var t=Math.floor(now()/1000);$('clock').textContent=Math.floor(t/60)+':'+('0'+t%60).slice(-2);}
  function start(){if(running)return;running=true;since=Date.now();$('startStop').textContent='Pause';}
  function pause(){if(!running)return;elapsed=now();running=false;$('startStop').textContent='Start';}
  $('startStop').onclick=function(){running?pause():start();this.blur();};
  $('reset').onclick=function(){running=false;elapsed=0;$('startStop').textContent='Start';paint();this.blur();};
  setInterval(paint,500);
})();
</script>
</body>
</html>
