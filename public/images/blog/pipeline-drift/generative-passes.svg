<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="2400" height="840" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- ================= BEFORE ================= -->
  <text x="26" y="42" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="1.6">BEFORE</text>

  <rect x="26" y="58" width="286" height="104" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="6 4"/>
  <text x="44" y="82" font-size="12" font-weight="600" fill="#4B5563">Analysis — text only</text>
  <text x="44" y="106" font-size="13" fill="#374151">Classify the scene, then decide</text>
  <text x="44" y="126" font-size="13" fill="#374151">which corrections this photo</text>
  <text x="44" y="146" font-size="13" fill="#374151">needs and how much.</text>

  <g stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="320" y1="110" x2="348" y2="110"/>
  </g>

  <g font-size="12" fill="#7C2D12" text-anchor="middle">
    <rect x="358" y="64" width="112" height="42" rx="6" fill="#FFF3EC" stroke="#E9A882"/>
    <text x="414" y="90">Perspective</text>
    <rect x="358" y="116" width="112" height="42" rx="6" fill="#FFF3EC" stroke="#E9A882"/>
    <text x="414" y="142">Brighten</text>
    <rect x="486" y="64" width="112" height="42" rx="6" fill="#FFF3EC" stroke="#E9A882"/>
    <text x="542" y="90">Window pull</text>
    <rect x="486" y="116" width="112" height="42" rx="6" fill="#FFF3EC" stroke="#E9A882"/>
    <text x="542" y="136">White</text><text x="542" y="151">balance</text>
    <rect x="614" y="64" width="112" height="42" rx="6" fill="#FFF3EC" stroke="#E9A882"/>
    <text x="670" y="90">Relight</text>
    <rect x="614" y="116" width="112" height="42" rx="6" fill="#FFF3EC" stroke="#E9A882"/>
    <text x="670" y="142">Sky</text>
    <rect x="742" y="90" width="112" height="42" rx="6" fill="#FFF3EC" stroke="#E9A882"/>
    <text x="798" y="110">Color</text><text x="798" y="125">correction</text>
  </g>

  <text x="884" y="100" font-size="26" font-weight="700" fill="#B23C0C">3.5 passes</text>
  <text x="884" y="124" font-size="13" fill="#6B7280">on an average photo, up to 7,</text>
  <text x="884" y="142" font-size="13" fill="#6B7280">each one chained into the next</text>

  <line x1="26" y1="212" x2="1174" y2="212" stroke="#E5E7EB"/>

  <!-- ================= AFTER ================= -->
  <text x="26" y="262" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="1.6">AFTER</text>

  <rect x="26" y="278" width="286" height="104" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="6 4"/>
  <text x="44" y="302" font-size="12" font-weight="600" fill="#4B5563">Analysis — unchanged</text>
  <text x="44" y="326" font-size="13" fill="#374151">Classify the scene, then decide</text>
  <text x="44" y="346" font-size="13" fill="#374151">which corrections this photo</text>
  <text x="44" y="366" font-size="13" fill="#374151">needs and how much.</text>

  <g stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="320" y1="330" x2="348" y2="330"/>
  </g>

  <rect x="358" y="300" width="496" height="60" rx="8" fill="#FFF3EC" stroke="#B23C0C" stroke-width="2"/>
  <text x="606" y="328" font-size="15" font-weight="600" fill="#7C2D12" text-anchor="middle">One combined edit</text>
  <text x="606" y="348" font-size="12" fill="#9A3412" text-anchor="middle">the same corrections, assembled into a single prompt</text>

  <text x="884" y="320" font-size="26" font-weight="700" fill="#15803D">1 pass</text>
  <text x="884" y="344" font-size="13" fill="#6B7280">every photo, nothing chained</text>
</svg>
